version: 2
project_name: damstack

builds:
  - main: ./cmd/damstack
    binary: damstack
    env:
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/eugene-panin/damstack/internal/release.Version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc

homebrew_casks:
  - name: damstack
    repository:
      owner: eugene-panin
      name: homebrew-tap
    directory: Casks
    homepage: https://github.com/eugene-panin/damstack
    description: Set up your own server and run apps on it from one file you edit
    license: MIT
    caveats: |
      Run damstack: it checks this Mac and says where to start.
    # The binary is not notarized: without this macOS refuses to run it.
    # GoReleaser's hooks still write the postflight block Homebrew deprecated.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/damstack"]
        end
      end
