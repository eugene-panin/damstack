---
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", LICENSE]
  pull_request:
    paths-ignore: ["**.md", LICENSE]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: format, vet, static checks, build
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet and static checks, for macOS
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          GOOS=darwin go vet ./...
          GOOS=darwin staticcheck ./...

      - name: Build for both kinds of Mac
        run: |
          for arch in arm64 amd64; do
            GOOS=darwin GOARCH=$arch CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/damstack
          done

  vulns:
    name: known vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: govulncheck, for macOS
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          GOOS=darwin govulncheck ./...

  test:
    name: test and e2e (macOS)
    if: github.event_name != 'schedule'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -race -count=1 ./...

      - name: An SSH key, as a person has
        run: ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519

      - name: End to end
        run: test/e2e.sh </dev/null
